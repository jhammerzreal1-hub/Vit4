        function isOpaqueCrossOriginScriptError(e) {
          if (!e) return false;
          var msg = String(e.message || '').trim();
          return /^script error\.?$/i.test(msg) && !e.error && !e.filename && (!e.lineno || e.lineno === 0);

        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String((a && a.message) || a); }).join(' ');
          if (shouldSuppress(joined)) return;
          return origWarn.apply(console, arguments);
        };
        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String((a && a.message) || a); }).join(' ');
          if (shouldSuppress(joined)) return;

          if (shouldSuppress(reason)) {

          var msg = e ? (e.message || (e.error && e.error.message) || e.error) : '';
          if (isOpaqueCrossOriginScriptError(e) || shouldSuppress(msg)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
